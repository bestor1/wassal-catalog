<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TourniPos Catalog - Partage de stock</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4b13a3">
    
    <link rel="icon" type="image/png" href="./tournipos_catalog_logo.png">
    <link rel="apple-touch-icon" href="./tournipos_catalog_logo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/whatwg-fetch/3.6.19/fetch.min.js"></script>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var el = document.getElementById('root');
            var source = url ? url : 'Script local (index.html)';
            if (el) {
                el.innerHTML = '<div style="padding:20px; color:#b91c1c; font-family:sans-serif; background:#fef2f2; height:100vh;">' +
                               '<h2 style="font-weight:bold; font-size: 20px;">⚠️ Erreur Technique</h2>' +
                               '<p style="margin-top:10px;">Le navigateur a bloqué le démarrage.</p>' +
                               '<div style="background:#000; color:#0f0; padding:15px; border-radius:5px; margin-top:15px; font-family:monospace; font-size:12px; overflow-x:auto;">' +
                               '<strong>Message:</strong> ' + msg + '<br><br>' +
                               '<strong>Fichier source:</strong> ' + source + '<br><br>' +
                               '<strong>Ligne:</strong> ' + lineNo +
                               '</div></div>';
            }
            return false;
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root">
        <div style="padding: 20px; text-align: center; color: #666; font-family: sans-serif;">
            Chargement de l'application... (Si cet écran reste figé, vérifiez votre connexion)
        </div>
    </div>

    <script type="text/babel" data-presets="es2015,react,stage-2">
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            console.error("React n'a pas pu être chargé. Vérifiez votre connexion internet ou vos extensions bloquantes.");
        }

        const { useState, useEffect, useMemo } = React;

        const GOOGLE_CLIENT_ID = "807679772275-56vf7kfl75jjeujht8vu7pgmja5evd5r.apps.googleusercontent.com"; 

        const DEFAULT_CONFIG = {
            prodTable: '', nameCol: '', priceCol: '', stockMode: 'inline',
            inlineStockCol: '', stockTable: '', stockQtyCol: '', stockProdIdCol: '', prodIdCol: '',
            catTable: '', prodCatCol: '', catIdCol: '', catNameCol: '', inlineCatCol: ''
        };

        function App() {
            const [view, setView] = useState('login'); 
            const [loadingMessage, setLoadingMessage] = useState('');
            const [products, setProducts] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [error, setError] = useState(null);
            const [dbInfo, setDbInfo] = useState({ date: null, name: '' });
            const [hideEmptyStock, setHideEmptyStock] = useState(false);
            const [selectedCategory, setSelectedCategory] = useState('Toutes');

            const allCategories = useMemo(function() {
                const cats = { "Toutes": true };
                products.forEach(function(p) {
                    const c = p.categorie && p.categorie.trim() !== '' ? p.categorie : "Autres";
                    cats[c] = true;
                });
                return Object.keys(cats).sort(function(a, b) {
                    if (a === 'Toutes') return -1;
                    if (b === 'Toutes') return 1;
                    return a.localeCompare(b);
                });
            }, [products]);
            
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isInstallable, setIsInstallable] = useState(false);

            useEffect(function() {
                const handler = function(e) {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                };
                window.addEventListener('beforeinstallprompt', handler);
                return function() { window.removeEventListener('beforeinstallprompt', handler); };
            }, []);

            const handleInstallClick = async function() {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const choiceResult = await deferredPrompt.userChoice;
                if (choiceResult.outcome === 'accepted') {
                    console.log('Application installée');
                }
                setDeferredPrompt(null);
                setIsInstallable(false);
            };

            const [config, setConfig] = useState(() => {
                let res = {};
                for (let k in DEFAULT_CONFIG) res[k] = DEFAULT_CONFIG[k];
                try { 
                    // V6 : NOUVEAU NETTOYAGE POUR LE CODE "LABEL"
                    const saved = localStorage.getItem('wassal_config_v6'); 
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        for (let k in parsed) res[k] = parsed[k];
                    }
                } catch(e) {}
                return res;
            });

            const saveConfigToStorage = (cfg) => {
                try { localStorage.setItem('wassal_config_v6', JSON.stringify(cfg)); } catch(e) {}
            };

            const initSqlJsReady = useMemo(function() {
                if (typeof window.initSqlJs !== 'function') {
                    console.error("SQL.js n'a pas pu se charger.");
                    return Promise.reject(new Error("Le lecteur de base de données est incompatible avec ce navigateur."));
                }
                return window.initSqlJs({
                    locateFile: function(file) { return "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/" + file; }
                });
            }, []);

            const handleGoogleLogin = function() {
                setError(null);
                if (GOOGLE_CLIENT_ID.trim() === "") {
                    setError("Configuration requise : Veuillez insérer votre GOOGLE_CLIENT_ID.");
                    return;
                }

                const client = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.readonly',
                    callback: function(tokenResponse) {
                        if (tokenResponse && tokenResponse.access_token) {
                            fetchLatestDatabase(tokenResponse.access_token);
                        }
                    },
                });
                client.requestAccessToken();
            };

            const fetchLatestDatabase = async function(accessToken) {
                setView('loading');
                setLoadingMessage("Recherche de la sauvegarde sur Google Drive...");
                
                try {
                    const searchUrl = 'https://www.googleapis.com/drive/v3/files?q=name+contains+".db"&orderBy=modifiedTime+desc&pageSize=1&fields=files(id,name,modifiedTime)';
                    const searchRes = await fetch(searchUrl, {
                        headers: { Authorization: "Bearer " + accessToken }
                    });
                    const searchData = await searchRes.json();

                    if (!searchData.files || searchData.files.length === 0) {
                        throw new Error("Aucun fichier .db trouvé sur ce compte Google Drive.");
                    }

                    const file = searchData.files[0];
                    setDbInfo({ name: file.name, date: new Date(file.modifiedTime).toLocaleString('fr-FR') });
                    setLoadingMessage("Téléchargement de " + file.name + "...");

                    const downloadUrl = "https://www.googleapis.com/drive/v3/files/" + file.id + "?alt=media";
                    const downloadRes = await fetch(downloadUrl, {
                        headers: { Authorization: "Bearer " + accessToken }
                    });
                    
                    if (!downloadRes.ok) throw new Error("Erreur lors du téléchargement.");
                    
                    const arrayBuffer = await downloadRes.arrayBuffer();
                    await parseDatabase(arrayBuffer);

                } catch (err) {
                    console.error(err);
                    setError(err.message || "Erreur lors de la récupération Drive.");
                    setView('login');
                }
            };

            const autoDetectConfig = function(sch) {
                const tables = Object.keys(sch);
                if (tables.length === 0) return null;
                
                const prodTable = tables.find(function(t) { 
                    const tl = t.toLowerCase();
                    return tl.indexOf('prod') !== -1 || tl.indexOf('art') !== -1 || tl.indexOf('item') !== -1; 
                }) || tables[0];
                const pCols = sch[prodTable] || [];

                const findCol = function(cols, exactList, partialList) {
                    if (!cols) return '';
                    var match = cols.find(function(c) { return exactList.indexOf(c.toLowerCase()) !== -1; });
                    if (match) return match;
                    match = cols.find(function(c) {
                        return partialList.some(function(p) { return c.toLowerCase().indexOf(p) !== -1; });
                    });
                    return match || '';
                };

                const nameCol = findCol(pCols, ['name', 'nom', 'designation', 'libelle', 'label'], ['name', 'nom', 'desig', 'lib', 'label']) || pCols[0];
                const priceCol = findCol(pCols, ['sell_price', 'prix_vente', 'prix', 'price'], ['sell', 'vente', 'price', 'prix']) || pCols[0]; 
                const inlineStockCol = findCol(pCols, ['stock', 'quantity', 'qte', 'quantite'], ['stock', 'quant', 'qte']) || pCols[0]; 
                const prodIdCol = findCol(pCols, ['id', 'product_id', 'id_produit', 'code', 'ref'], ['id', 'code', 'ref']) || pCols[0];

                const catTable = tables.find(function(t) { 
                    const tl = t.toLowerCase();
                    return tl.indexOf('cat') !== -1 || tl.indexOf('fam') !== -1 || tl.indexOf('ray') !== -1 || 
                           tl.indexOf('grp') !== -1 || tl.indexOf('marq') !== -1 || tl.indexOf('sect') !== -1 || 
                           tl.indexOf('emp') !== -1 || tl.indexOf('dep') !== -1 || tl.indexOf('typ') !== -1; 
                });

                let catIdCol = '', catNameCol = '', prodCatCol = '', inlineCatCol = '';
                
                if (catTable) {
                    const cCols = sch[catTable] || [];
                    prodCatCol = findCol(pCols, ['category_id', 'id_categorie', 'id_famille', 'famille_id'], ['cat', 'fam', 'ray', 'grp', 'marq', 'sect', 'emp', 'dep', 'typ']);
                    catIdCol = findCol(cCols, ['id', 'code', 'ref'], ['id', 'code', 'ref']);
                    
                    // L'AJOUT CRUCIAL EST ICI : On cherche la colonne 'label' vue sur votre capture
                    catNameCol = findCol(cCols, ['label', 'name', 'nom', 'libelle', 'designation'], ['label', 'name', 'nom', 'lib', 'desig']);
                }

                inlineCatCol = findCol(pCols, ['famille', 'categorie', 'rayon', 'groupe', 'marque'], ['fam', 'cat', 'ray', 'grp', 'marq', 'sect', 'emp', 'dep', 'typ']);

                return { 
                    prodTable: prodTable, 
                    nameCol: nameCol, 
                    priceCol: priceCol, 
                    stockMode: 'inline', 
                    inlineStockCol: inlineStockCol, 
                    stockTable: '', 
                    stockQtyCol: '', 
                    stockProdIdCol: '', 
                    prodIdCol: prodIdCol,
                    catTable: catTable || '',
                    prodCatCol: prodCatCol,
                    catIdCol: catIdCol,
                    catNameCol: catNameCol,
                    inlineCatCol: inlineCatCol
                };
            };

            const executeConfigQuery = function(db, cfg) {
                if (!cfg || !cfg.prodTable) throw new Error("Configuration manquante.");
                
                let catSelect = "'Autres'"; 
                let catJoin = "";
                
                if (cfg.catTable && cfg.prodCatCol && cfg.catIdCol && cfg.catNameCol) {
                    catSelect = 'IFNULL(c."' + cfg.catNameCol + '", \'Autres\')';
                    catJoin = ' LEFT JOIN "' + cfg.catTable + '" c ON p."' + cfg.prodCatCol + '" = c."' + cfg.catIdCol + '"';
                } else if (cfg.inlineCatCol) {
                    catSelect = 'IFNULL(p."' + cfg.inlineCatCol + '", \'Autres\')';
                }

                const q = 'SELECT p."' + cfg.nameCol + '", p."' + cfg.priceCol + '", IFNULL(p."' + cfg.inlineStockCol + '", 0), ' + catSelect + ' FROM "' + cfg.prodTable + '" p' + catJoin + ' LIMIT 3000';

                try {
                    const res = db.exec(q);
                    if (res.length > 0) {
                        return res[0].values.map(function(row) {
                            return {
                                nom: row[0] || "Produit sans nom",
                                prix: (row[1] || 0) / 100,
                                quantite: Math.round((row[2] || 0) / 1000),
                                categorie: row[3] || "Autres"
                            };
                        });
                    }
                } catch (e) {
                    console.warn("Échec de la jointure des catégories, tentative de secours...", e);
                    const fallbackQ = 'SELECT p."' + cfg.nameCol + '", p."' + cfg.priceCol + '", IFNULL(p."' + cfg.inlineStockCol + '", 0), \'Autres\' FROM "' + cfg.prodTable + '" p LIMIT 3000';
                    const fallbackRes = db.exec(fallbackQ);
                    if (fallbackRes.length > 0) {
                        return fallbackRes[0].values.map(function(row) {
                            return {
                                nom: row[0] || "Produit sans nom",
                                prix: (row[1] || 0) / 100,
                                quantite: Math.round((row[2] || 0) / 1000),
                                categorie: "Autres"
                            };
                        });
                    }
                }
                throw new Error("Aucun produit retourné par cette requête.");
            };

            const parseDatabase = async function(arrayBuffer) {
                setLoadingMessage("Analyse des produits et des rayons...");
                
                try {
                    const SQL = await initSqlJsReady;
                    const db = new SQL.Database(new Uint8Array(arrayBuffer));
                    
                    const currentSchema = {};
                    let allTables = [];
                    try {
                        const tablesInfo = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
                        if (tablesInfo.length > 0) {
                            allTables = tablesInfo[0].values.map(function(r) { return r[0]; });
                            allTables.forEach(function(t) {
                                const colRes = db.exec('PRAGMA table_info("' + t + '")');
                                if (colRes.length > 0) {
                                    currentSchema[t] = colRes[0].values.map(function(r) { return r[1]; });
                                }
                            });
                        }
                    } catch(e) { console.warn(e); }

                    let activeConfig = config;
                    if (!activeConfig || !activeConfig.prodTable || activeConfig.prodTable === '') {
                        activeConfig = autoDetectConfig(currentSchema) || DEFAULT_CONFIG;
                    }

                    try {
                        const parsed = executeConfigQuery(db, activeConfig);
                        setProducts(parsed);
                        setConfig(activeConfig);
                        saveConfigToStorage(activeConfig);
                        setView('catalog');
                    } catch (e) {
                        console.warn("Échec requête :", e);
                        setError("Le format de la base de données est invalide ou le catalogue est vide.");
                        setView('login'); 
                    }

                    db.close();
                } catch (err) {
                    console.error(err);
                    setError("Erreur d'analyse : " + err.message);
                    setView('login');
                }
            };

            const loadDemoData = async function() {
                setView('loading');
                setLoadingMessage("Génération du fichier de démonstration...");
                setError(null);
                try {
                    const SQL = await initSqlJsReady;
                    const db = new SQL.Database();
                    db.run("CREATE TABLE Famille (id INTEGER PRIMARY KEY, libelle TEXT);");
                    db.run("INSERT INTO Famille VALUES (1, 'Boissons');");
                    db.run("INSERT INTO Famille VALUES (2, 'Biscuits');");
                    
                    db.run("CREATE TABLE Article (id INTEGER PRIMARY KEY, designation TEXT, prix_vente REAL, stock INTEGER, id_famille INTEGER);");
                    db.run("INSERT INTO Article VALUES (1, 'Jus d''orange', 14000.00, 0, 1);");
                    db.run("INSERT INTO Article VALUES (2, 'Bimo Double Mix', 12000.00, 21000, 2);");
                    db.run("INSERT INTO Article VALUES (3, 'Bimo Gaufrette', 13000.00, 50000, 2);");
                    const binaryArray = db.export();
                    db.close();
                    setDbInfo({ name: 'demo.db', date: new Date().toLocaleString('fr-FR') });
                    await parseDatabase(binaryArray.buffer);
                } catch (err) {
                    setError("Erreur : " + err.message);
                    setView('login');
                }
            };

            const filteredProducts = products.filter(function(p) {
                const matchSearch = p.nom.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
                const matchStock = hideEmptyStock ? p.quantite > 0 : true;
                const cat = p.categorie && p.categorie.trim() !== '' ? p.categorie : "Autres";
                const matchCategory = selectedCategory === 'Toutes' || cat === selectedCategory;
                
                return matchSearch && matchStock && matchCategory;
            });

            const generateText = function() {
                const cart = "\uD83D\uDED2";
                const pointDown = "\uD83D\uDC47";

                let text = cart + " *BON DE COMMANDE*\n";
                text += "------------------------\n";
                text += pointDown + " *Instructions :*\n";
                text += "1. Copiez ce message\n";
                text += "2. Collez-le dans la zone de texte\n";
                text += "3. Indiquez la quantité voulue entre les crochets [ ]\n";
                text += "------------------------\n";

                const grouped = {};
                filteredProducts.forEach(function(p) {
                    const cat = p.categorie && p.categorie.trim() !== '' ? p.categorie : "Autres";
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(p);
                });

                Object.keys(grouped).sort().forEach(function(cat) {
                    text += "\n\uD83D\uDCCB *" + cat.toUpperCase() + "*\n";
                    grouped[cat].forEach(function(p) {
                        if (p.quantite > 0) {
                            text += "[   ] *" + p.nom + "* - " + p.prix + " DZD\n";
                        } else {
                            text += "[ \u274C Rupture ] *" + p.nom + "* - " + p.prix + " DZD\n";
                        }
                    });
                });

                text += "\n_Généré via TourniPos Catalog_";
                return text;
            };

            const shareWhatsApp = function() {
                const text = generateText();
                const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
                window.open(url, '_blank');
            };

            const copyToClipboard = function() {
                const text = generateText();
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
                alert("Texte copié ! Vous pouvez faire Clic-Droit > Coller (ou Ctrl+V) dans WhatsApp.");
            };

            if (view === 'loading') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                        <div className="loader mb-4"></div>
                        <p className="text-gray-700 font-medium">{loadingMessage}</p>
                    </div>
                );
            }

            if (view === 'catalog') {
                return (
                    <div className="flex flex-col h-screen bg-gray-50">
                        <div className="bg-blue-600 text-white p-4 shadow-md z-10">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-3">
                                    <img src="./tournipos_catalog_logo.png" alt="Logo" className="w-10 h-10 rounded-lg shadow-sm border border-blue-400" />
                                    <div>
                                        <h1 className="text-xl font-bold">TourniPos Catalog</h1>
                                        <p className="text-xs text-blue-200">
                                            <i className="fa-solid fa-clock mr-1"></i> Données du : {dbInfo.date}
                                        </p>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={function() { setView('login'); }}
                                        className="bg-blue-700 hover:bg-blue-800 p-2 rounded-full text-sm transition-colors flex items-center justify-center w-8 h-8"
                                    >
                                        <i className="fa-solid fa-sign-out-alt"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div className="relative">
                                <i className="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="Rechercher un produit..." 
                                    className="w-full pl-10 pr-4 py-2 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner"
                                    value={searchQuery}
                                    onChange={function(e) { setSearchQuery(e.target.value); }}
                                />
                            </div>

                            <div className="mt-3 flex justify-between items-center gap-2">
                                <div className="relative flex-1 max-w-[60%]">
                                    <select
                                        className="w-full pl-3 pr-8 py-1.5 rounded-lg bg-blue-700 text-white text-sm border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-300 appearance-none shadow-sm"
                                        value={selectedCategory}
                                        onChange={function(e) { setSelectedCategory(e.target.value); }}
                                    >
                                        {allCategories.map(function(c) {
                                            return <option key={c} value={c}>{c === 'Toutes' ? 'Toutes les catégories' : c}</option>;
                                        })}
                                    </select>
                                    <i className="fa-solid fa-chevron-down absolute right-3 top-2.5 text-blue-200 pointer-events-none text-xs"></i>
                                </div>

                                <label className="flex items-center space-x-2 text-sm text-blue-100 hover:text-white cursor-pointer transition-colors flex-shrink-0">
                                    <input 
                                        type="checkbox" 
                                        className="rounded border-none w-4 h-4 cursor-pointer accent-blue-400"
                                        checked={hideEmptyStock}
                                        onChange={function(e) { setHideEmptyStock(e.target.checked); }}
                                    />
                                    <span><i className="fa-solid fa-filter mr-1"></i> En stock</span>
                                </label>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
                            {filteredProducts.length === 0 ? (
                                <div className="text-center mt-10">
                                    <p className="text-gray-500 mb-4">Aucun produit trouvé.</p>
                                </div>
                            ) : (
                                (function() {
                                    const grouped = {};
                                    filteredProducts.forEach(function(p) {
                                        const cat = p.categorie && p.categorie.trim() !== '' ? p.categorie : "Autres";
                                        if (!grouped[cat]) grouped[cat] = [];
                                        grouped[cat].push(p);
                                    });

                                    return Object.keys(grouped).sort().map(function(cat) {
                                        return (
                                            <div key={cat} className="mb-6">
                                                <h2 className="text-lg font-extrabold text-blue-900 mb-3 ml-1 border-b-2 border-blue-200 pb-1 flex items-center">
                                                    <i className="fa-solid fa-folder-open text-blue-500 mr-2"></i> {cat}
                                                </h2>
                                                <div className="space-y-3">
                                                    {grouped[cat].map(function(p, index) {
                                                        return (
                                                            <div key={index} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                                                <div>
                                                                    <h2 className="font-bold text-gray-800 text-lg">{p.nom}</h2>
                                                                    <p className="text-sm text-gray-500 mt-1">
                                                                        Stock: <span className={p.quantite > 0 ? "text-green-600 font-bold" : "text-red-500 font-bold"}>
                                                                            {p.quantite > 0 ? p.quantite + " dispo." : "Rupture"}
                                                                        </span>
                                                                    </p>
                                                                </div>
                                                                <div className="text-right">
                                                                    <span className="font-extrabold text-blue-600">{p.prix}</span>
                                                                    <span className="text-xs text-gray-500 ml-1">DZD</span>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    });
                                })()
                            )}
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-gray-100 to-transparent flex gap-3">
                            <button 
                                onClick={copyToClipboard}
                                className="w-1/4 bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg flex justify-center items-center transition-transform transform active:scale-95"
                                title="Copier le texte"
                            >
                                <i className="fa-solid fa-copy text-xl"></i>
                            </button>
                            <button 
                                onClick={shareWhatsApp}
                                className="w-3/4 bg-[#25D366] hover:bg-[#1ebd5a] text-white font-bold py-4 rounded-2xl shadow-lg flex justify-center items-center text-lg transition-transform transform active:scale-95"
                            >
                                <i className="fa-brands fa-whatsapp text-2xl mr-3"></i>
                                Partager ({filteredProducts.length})
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-white">
                    
                    <img 
                        src="./tournipos_catalog_logo.png" 
                        alt="TourniPos Catalog" 
                        className="w-28 h-28 rounded-2xl mb-4 shadow-md object-cover" 
                    />
                    
                    <h1 className="text-3xl font-extrabold text-gray-900 mb-2">TourniPos Catalog</h1>
                    <p className="text-center text-gray-500 mb-8">
                        Connectez votre compte Google pour extraire automatiquement le catalogue depuis votre base de données.
                    </p>

                    {error && (
                        <div className="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 w-full rounded-r-lg text-sm whitespace-pre-wrap font-mono">
                            <i className="fa-solid fa-triangle-exclamation mr-2 font-sans"></i><br/>{error}
                        </div>
                    )}

                    <button 
                        onClick={handleGoogleLogin}
                        className="w-full max-w-sm bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center mb-4 hover:bg-gray-50 active:bg-gray-100 transition-colors"
                    >
                        <svg className="w-5 h-5 mr-3" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            <path fill="none" d="M0 0h48v48H0z"/>
                        </svg>
                        Synchroniser via Google Drive
                    </button>

                    {isInstallable && (
                        <button 
                            onClick={handleInstallClick}
                            className="w-full max-w-sm bg-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center mb-4 hover:bg-green-600 transition-colors border border-green-600 animate-pulse"
                        >
                            <i className="fa-solid fa-download mr-3 text-xl"></i>
                            Installer l'application
                        </button>
                    )}

                    <div className="flex items-center w-full max-w-sm my-4">
                        <div className="flex-grow border-t border-gray-200"></div>
                        <span className="flex-shrink-0 mx-4 text-gray-400 text-sm">ou</span>
                        <div className="flex-grow border-t border-gray-200"></div>
                    </div>

                    <button 
                        onClick={loadDemoData}
                        className="w-full max-w-sm bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 transition-colors"
                    >
                        <i className="fa-solid fa-vial mr-3"></i>
                        Tester avec le Mode Démo
                    </button>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (typeof ReactDOM !== 'undefined') {
            if (ReactDOM.createRoot) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            } else {
                ReactDOM.render(<App />, rootElement);
            }
        } else {
            rootElement.innerHTML = "Erreur critique : ReactDOM n'a pas pu être chargé.";
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(registration) {
                    console.log('ServiceWorker activé avec succès');
                }, function(err) {
                    console.log('Erreur du ServiceWorker :', err);
                });
            });
        }
    </script>
</body>
</html>
