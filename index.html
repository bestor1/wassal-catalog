<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wassal Catalog - Partage de stock</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Retour à la version 18 d'origine qui marchait très bien !) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SQL.js (SQLite dans le navigateur) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // L'ID est déjà pré-rempli pour vous !
        const GOOGLE_CLIENT_ID = "807679772275-56vf7kfl75jjeujht8vu7pgmja5evd5r.apps.googleusercontent.com"; 

        function App() {
            const [view, setView] = useState('login'); // login, loading, catalog
            const [loadingMessage, setLoadingMessage] = useState('');
            const [products, setProducts] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [error, setError] = useState(null);
            const [dbInfo, setDbInfo] = useState({ date: null, name: '' });
            const [hideEmptyStock, setHideEmptyStock] = useState(false);
            
            // États pour le Diagnostic
            const [diagnosticData, setDiagnosticData] = useState(null);
            const [showDiagnostic, setShowDiagnostic] = useState(false);

            const initSqlJsReady = useMemo(() => {
                return window.initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
            }, []);

            const handleGoogleLogin = () => {
                setError(null);
                if (GOOGLE_CLIENT_ID.trim() === "") {
                    setError("Configuration requise : Veuillez insérer votre GOOGLE_CLIENT_ID.");
                    return;
                }

                const client = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.readonly',
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            fetchLatestDatabase(tokenResponse.access_token);
                        }
                    },
                });
                client.requestAccessToken();
            };

            const fetchLatestDatabase = async (accessToken) => {
                setView('loading');
                setLoadingMessage("Recherche de la sauvegarde sur Google Drive...");
                
                try {
                    const searchUrl = 'https://www.googleapis.com/drive/v3/files?q=name+contains+".db"&orderBy=modifiedTime+desc&pageSize=1&fields=files(id,name,modifiedTime)';
                    const searchRes = await fetch(searchUrl, {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    const searchData = await searchRes.json();

                    if (!searchData.files || searchData.files.length === 0) {
                        throw new Error("Aucun fichier .db trouvé sur ce compte Google Drive.");
                    }

                    const file = searchData.files[0];
                    setDbInfo({ name: file.name, date: new Date(file.modifiedTime).toLocaleString('fr-FR') });
                    setLoadingMessage(`Téléchargement de ${file.name}...`);

                    const downloadUrl = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`;
                    const downloadRes = await fetch(downloadUrl, {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    
                    if (!downloadRes.ok) throw new Error("Erreur lors du téléchargement.");
                    
                    const arrayBuffer = await downloadRes.arrayBuffer();
                    await parseDatabase(arrayBuffer);

                } catch (err) {
                    console.error(err);
                    setError(err.message || "Erreur lors de la récupération Drive.");
                    setView('login');
                }
            };

            // --------------------------------------------------------
            // LECTURE SQLITE INTÉLLIGENTE (AUTO-ÉVALUATEUR)
            // --------------------------------------------------------
            const parseDatabase = async (arrayBuffer) => {
                setLoadingMessage("Analyse avancée de la structure de stock...");
                try {
                    const SQL = await initSqlJsReady;
                    const db = new SQL.Database(new Uint8Array(arrayBuffer));
                    
                    let prodCols = [];
                    let stockCols = [];
                    let allTables = [];
                    
                    try {
                        const tablesInfo = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
                        if (tablesInfo.length > 0) allTables = tablesInfo[0].values.map(r => r[0]);
                        
                        const pInfo = db.exec("PRAGMA table_info(Product)");
                        if (pInfo.length > 0) prodCols = pInfo[0].values.map(row => row[1]);
                        
                        const sInfo = db.exec("PRAGMA table_info(Stock)");
                        if (sInfo.length > 0) stockCols = sInfo[0].values.map(row => row[1]);
                    } catch(e) { console.warn("PRAGMA error", e); }

                    if (prodCols.length === 0) throw new Error("La table 'Product' est introuvable.");

                    // Recherche des colonnes par mots clés
                    const findCol = (cols, exactList, partialList = [], excludeList = []) => {
                        let found = cols.find(c => exactList.includes(c.toLowerCase()));
                        if (found) return found;
                        found = cols.find(c => {
                            const l = c.toLowerCase();
                            return partialList.some(p => l.includes(p)) && !excludeList.some(e => l.includes(e));
                        });
                        return found;
                    };

                    // Colonnes reconnues
                    const nameCol = findCol(prodCols, ['name', 'nom', 'designation', 'label', 'libelle'], ['nom', 'desig', 'name']);
                    const priceCol = findCol(prodCols, ['unit_price_1', 'price', 'prix', 'sell_price', 'tarif'], ['prix', 'price', 'vente'], ['achat', 'cost', 'min', 'max', 'revient']);
                    const prodIdCol = findCol(prodCols, ['id', '_id', 'product_id', 'id_product'], ['id']);

                    const inlineStockCol = findCol(prodCols, ['current_stock', 'quantity', 'quantite', 'stock', 'qte', 'qty', 'solde'], ['stock', 'qte', 'quant', 'qty', 'solde'], ['alert', 'min', 'max', 'seuil']);
                    const stockQtyCol = findCol(stockCols, ['current_stock', 'quantity', 'quantite', 'stock', 'qte', 'qty'], ['stock', 'qte', 'quant', 'qty']);
                    const stockProdIdCol = findCol(stockCols, ['id_product', 'product_id', 'produit_id', 'productid'], ['prod', 'id']);

                    if (!nameCol || !priceCol) throw new Error("Impossible d'identifier les colonnes Nom ou Prix.");

                    let finalRes = null;
                    let usedQuery = "";
                    let maxTotalStock = -1;

                    const evaluateQuery = (q) => {
                        try {
                            const r = db.exec(q);
                            if (r.length > 0) {
                                const total = r[0].values.reduce((acc, row) => acc + Number(row[2] || 0), 0);
                                if (total > maxTotalStock) {
                                    maxTotalStock = total;
                                    finalRes = r;
                                    usedQuery = q;
                                }
                            }
                        } catch(e) { console.warn("Échec requête:", q, e); }
                    };

                    // Les 3 requêtes possibles
                    if (inlineStockCol) {
                        evaluateQuery(`SELECT ${nameCol}, ${priceCol}, ${inlineStockCol} FROM Product LIMIT 3000`);
                    }

                    if (stockCols.length > 0 && stockQtyCol && stockProdIdCol && prodIdCol) {
                        evaluateQuery(`SELECT p.${nameCol}, p.${priceCol}, SUM(IFNULL(s.${stockQtyCol}, 0)) FROM Product p LEFT JOIN Stock s ON p.${prodIdCol} = s.${stockProdIdCol} GROUP BY p.${prodIdCol} LIMIT 3000`);
                    }

                    if (!finalRes) {
                        evaluateQuery(`SELECT ${nameCol}, ${priceCol}, 1 FROM Product LIMIT 3000`);
                    }

                    let parsedProducts = [];
                    if (finalRes && finalRes.length > 0) {
                        parsedProducts = finalRes[0].values.map(row => ({
                            nom: row[0] || "Produit",
                            prix: row[1] || 0,
                            quantite: Math.round(row[2] || 0) 
                        }));
                    } else {
                        throw new Error("Catalogue vide.");
                    }

                    // Sauvegarde pour le rapport visuel 🐛
                    setDiagnosticData({
                        tables: allTables.join(', '),
                        prodCols: prodCols.join(', '),
                        stockCols: stockCols.join(', '),
                        usedQuery: usedQuery,
                        totalStockFound: maxTotalStock
                    });

                    db.close();
                    setProducts(parsedProducts);
                    setView('catalog');

                } catch (err) {
                    console.error(err);
                    setError(err.message);
                    setView('login');
                }
            };

            const loadDemoData = async () => {
                setView('loading');
                setLoadingMessage("Génération du fichier de démonstration...");
                setError(null);
                try {
                    const SQL = await initSqlJsReady;
                    const db = new SQL.Database();
                    db.run("CREATE TABLE Product (id INTEGER PRIMARY KEY, name TEXT, unit_price_1 REAL, current_stock INTEGER, actif INTEGER);");
                    db.run("INSERT INTO Product VALUES (1, 'Cafe Torrefie 250g', 350.00, 150, 1);");
                    db.run("INSERT INTO Product VALUES (2, 'Lait Entier 1L', 110.00, 500, 1);");
                    db.run("INSERT INTO Product VALUES (3, 'Biscuits Chocolat x12', 120.00, 0, 1);");
                    db.run("INSERT INTO Product VALUES (4, 'Jus d''Orange 2L', 220.00, 40, 1);");
                    const binaryArray = db.export();
                    db.close();
                    setDbInfo({ name: 'demo.db', date: new Date().toLocaleString('fr-FR') });
                    await parseDatabase(binaryArray.buffer);
                } catch (err) {
                    setError("Erreur : " + err.message);
                    setView('login');
                }
            };

            const filteredProducts = products.filter(p => {
                const matchSearch = p.nom.toLowerCase().includes(searchQuery.toLowerCase());
                const matchStock = hideEmptyStock ? p.quantite > 0 : true;
                return matchSearch && matchStock;
            });

            const generateText = () => {
                const cart = String.fromCodePoint(0x1F6D2);
                const check = String.fromCodePoint(0x2705);
                const cross = String.fromCodePoint(0x274C);
                const dot = String.fromCodePoint(0x25AA, 0xFE0F);
                const money = String.fromCodePoint(0x1F4B0);
                const box = String.fromCodePoint(0x1F4E6);

                let text = cart + " *CATALOGUE DISPONIBLE*\n\n";
                filteredProducts.forEach(p => {
                    const status = p.quantite > 0 ? check : cross + " Rupture";
                    text += dot + " *" + p.nom + "*\n";
                    text += money + " Prix : " + p.prix + " DZD | " + box + " Stock : " + status + "\n\n";
                });
                text += "_Généré via Wassal Catalog_";
                return text;
            };

            const shareWhatsApp = () => {
                const text = generateText();
                const url = "https://web.whatsapp.com/send?text=" + encodeURIComponent(text);
                window.open(url, '_blank');
            };

            const copyToClipboard = () => {
                const text = generateText();
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
                alert("Texte copié ! Vous pouvez faire Clic-Droit > Coller (ou Ctrl+V) dans WhatsApp.");
            };

            if (view === 'loading') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                        <div className="loader mb-4"></div>
                        <p className="text-gray-700 font-medium">{loadingMessage}</p>
                    </div>
                );
            }

            // ÉCRAN DE DIAGNOSTIC (LE BOUTON INSECTE 🐛)
            if (showDiagnostic && diagnosticData) {
                return (
                    <div className="flex flex-col h-screen bg-gray-900 text-green-400 p-6 font-mono overflow-auto z-50 absolute inset-0">
                        <div className="flex justify-between items-center mb-6 border-b border-green-700 pb-4">
                            <h1 className="text-2xl font-bold text-white"><i className="fa-solid fa-bug text-yellow-400 mr-2"></i> Mode Diagnostic</h1>
                            <button onClick={() => setShowDiagnostic(false)} className="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg">Fermer</button>
                        </div>
                        
                        <div className="space-y-6 text-sm">
                            <div className="bg-black p-4 rounded-lg border border-gray-700">
                                <h2 className="text-yellow-400 font-bold text-lg mb-2">1. Tables identifiées dans la base :</h2>
                                <p className="text-gray-300 break-words">{diagnosticData.tables}</p>
                            </div>

                            <div className="bg-black p-4 rounded-lg border border-gray-700">
                                <h2 className="text-yellow-400 font-bold text-lg mb-2">2. Colonnes de la table [Product] :</h2>
                                <p className="text-blue-300 break-words">{diagnosticData.prodCols || "Aucune"}</p>
                            </div>

                            <div className="bg-black p-4 rounded-lg border border-gray-700">
                                <h2 className="text-yellow-400 font-bold text-lg mb-2">3. Colonnes de la table [Stock] :</h2>
                                <p className="text-blue-300 break-words">{diagnosticData.stockCols || "Aucune"}</p>
                            </div>

                            <div className="bg-black p-4 rounded-lg border border-green-700">
                                <h2 className="text-green-400 font-bold text-lg mb-2">4. Décision de l'Intelligence Artificielle :</h2>
                                <p className="mb-2"><span className="text-white">Requête gagnante utilisée :</span> <br/>
                                <span className="text-purple-400">{diagnosticData.usedQuery || "Aucune requête valide"}</span></p>
                                <p><span className="text-white">Stock total calculé :</span> <span className="text-xl font-bold text-green-500">{diagnosticData.totalStockFound}</span></p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'catalog') {
                return (
                    <div className="flex flex-col h-screen bg-gray-50">
                        <div className="bg-blue-600 text-white p-4 shadow-md z-10">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h1 className="text-xl font-bold">Wassal Catalog</h1>
                                    <p className="text-xs text-blue-200">
                                        <i className="fa-solid fa-clock mr-1"></i> Données du : {dbInfo.date}
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    {/* Le fameux bouton de diagnostic */}
                                    <button 
                                        onClick={() => setShowDiagnostic(true)}
                                        className="bg-blue-800 hover:bg-gray-800 p-2 rounded-full text-sm transition-colors text-yellow-300 shadow-inner flex items-center justify-center w-8 h-8"
                                        title="Voir les colonnes (Diagnostic)"
                                    >
                                        <i className="fa-solid fa-bug"></i>
                                    </button>
                                    <button 
                                        onClick={() => setView('login')}
                                        className="bg-blue-700 hover:bg-blue-800 p-2 rounded-full text-sm transition-colors flex items-center justify-center w-8 h-8"
                                    >
                                        <i className="fa-solid fa-sign-out-alt"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div className="relative">
                                <i className="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="Rechercher un produit..." 
                                    className="w-full pl-10 pr-4 py-2 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>

                            <div className="mt-3 flex justify-end">
                                <label className="flex items-center space-x-2 text-sm text-blue-100 hover:text-white cursor-pointer transition-colors">
                                    <input 
                                        type="checkbox" 
                                        className="rounded border-none w-4 h-4 cursor-pointer accent-blue-400"
                                        checked={hideEmptyStock}
                                        onChange={(e) => setHideEmptyStock(e.target.checked)}
                                    />
                                    <span><i className="fa-solid fa-filter mr-1"></i> En stock uniquement</span>
                                </label>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
                            {filteredProducts.length === 0 ? (
                                <div className="text-center mt-10">
                                    <p className="text-gray-500 mb-4">Aucun produit trouvé en stock.</p>
                                    <p className="text-sm text-gray-400">Cliquez sur l'icône <i className="fa-solid fa-bug text-yellow-500 mx-1"></i> en haut à droite<br/>pour voir où se cachent vos quantités.</p>
                                </div>
                            ) : (
                                filteredProducts.map((p, index) => (
                                    <div key={index} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                        <div>
                                            <h2 className="font-bold text-gray-800 text-lg">{p.nom}</h2>
                                            <p className="text-sm text-gray-500 mt-1">
                                                Stock: <span className={p.quantite > 0 ? "text-green-600 font-medium" : "text-red-500 font-medium"}>
                                                    {p.quantite > 0 ? `${p.quantite} dispo.` : "Rupture"}
                                                </span>
                                            </p>
                                        </div>
                                        <div className="text-right">
                                            <span className="font-extrabold text-blue-600">{p.prix}</span>
                                            <span className="text-xs text-gray-500 ml-1">DZD</span>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-gray-100 to-transparent flex gap-3">
                            <button 
                                onClick={copyToClipboard}
                                className="w-1/4 bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg flex justify-center items-center transition-transform transform active:scale-95"
                                title="Copier le texte"
                            >
                                <i className="fa-solid fa-copy text-xl"></i>
                            </button>
                            <button 
                                onClick={shareWhatsApp}
                                className="w-3/4 bg-[#25D366] hover:bg-[#1ebd5a] text-white font-bold py-4 rounded-2xl shadow-lg flex justify-center items-center text-lg transition-transform transform active:scale-95"
                            >
                                <i className="fa-brands fa-whatsapp text-2xl mr-3"></i>
                                Partager ({filteredProducts.length})
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-white">
                    <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-sm">
                        <i className="fa-solid fa-box-open text-4xl"></i>
                    </div>
                    <h1 className="text-3xl font-extrabold text-gray-900 mb-2">Wassal Catalog</h1>
                    <p className="text-center text-gray-500 mb-8">
                        Connectez votre compte Google pour extraire automatiquement le catalogue.
                    </p>

                    {error && (
                        <div className="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 w-full rounded-r-lg text-sm whitespace-pre-wrap font-mono">
                            <i className="fa-solid fa-triangle-exclamation mr-2 font-sans"></i><br/>{error}
                        </div>
                    )}

                    <button 
                        onClick={handleGoogleLogin}
                        className="w-full max-w-sm bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center mb-4 hover:bg-gray-50 active:bg-gray-100 transition-colors"
                    >
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" className="w-5 h-5 mr-3" />
                        Synchroniser via Google Drive
                    </button>

                    <div className="flex items-center w-full max-w-sm my-4">
                        <div className="flex-grow border-t border-gray-200"></div>
                        <span className="flex-shrink-0 mx-4 text-gray-400 text-sm">ou</span>
                        <div className="flex-grow border-t border-gray-200"></div>
                    </div>

                    <button 
                        onClick={loadDemoData}
                        className="w-full max-w-sm bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 transition-colors"
                    >
                        <i className="fa-solid fa-vial mr-3"></i>
                        Tester avec le Mode Démo
                    </button>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        
        // Utilisation forcée et universelle du rendu classique pour éviter toute erreur de version
        ReactDOM.render(<App />, rootElement);
    </script>
</body>
</html>
